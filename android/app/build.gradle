// ============================================================
// APP-LEVEL build.gradle
// File: app/build.gradle
// ============================================================
plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'    // ← Firebase plugin MUST be last
}

android {
    namespace 'com.dconnect.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.dconnect.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    // AndroidX Core
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Firebase BOM — manages all Firebase library versions
    implementation platform('com.google.firebase:firebase-bom:32.7.4')

    // Firebase Cloud Messaging (FCM) — CORE push notification library
    implementation 'com.google.firebase:firebase-messaging:23.4.0'

    // Firebase Analytics (required by BOM for proper initialization)
    implementation 'com.google.firebase:firebase-analytics'

    // HTTP networking (for sending FCM token to backend)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'

    // Location Services (GPS for home_lat, home_lng)
    implementation 'com.google.android.gms:play-services-location:21.2.0'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
